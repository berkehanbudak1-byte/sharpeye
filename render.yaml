services:
  - type: web
    name: haber-karsilastir
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_API_KEY
        sync: false        # anahtarı Render panelinden elle gir, dosyaya yazma
      - key: LLM_PROVIDER
        value: gemini
      - key: TRUST_PROXY
        value: "1"
