services:
  - type: web
    name: sharpeye-news
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_API_KEY
        sync: false        # anahtarı Render panelinden elle gir, dosyaya yazma
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: XAI_API_KEY
        sync: false        # yedek xAI/Grok anahtarını Render panelinden elle gir
      - key: XAI_MODEL
        value: grok-3-mini
      - key: LLM_PROVIDER
        value: gemini
      - key: ALLOWED_ORIGINS
        sync: false        # izinli tarayıcı kaynakları (virgülle ayrılmış)
      - key: TRUST_PROXY
        value: "1"
